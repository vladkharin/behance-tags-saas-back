name: Backend CI/CD & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🛠️ Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🏗️ Build Backend
        run: npm run build

  deploy-to-server:
    name: 🚀 Deploy to VPS (Docker)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: 📡 SSH Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment of BeRanked Backend..."
            cd ~/projects/behance-tags-saas-back || exit 1
            git fetch --all
            git reset --hard origin/master
            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose up -d --build
            echo "🗄️ Syncing Prisma Database Schema..."
            docker compose exec -T api npx prisma db push
            echo "🧹 Cleaning unused docker images..."
            docker image prune -f
            echo "✅ Backend deployment finished successfully!"
