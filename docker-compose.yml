version: '3.8'

services:
  # База данных PostgreSQL (Защищена: доступ только локально/внутри сети)
  postgres:
    image: postgres:15-alpine
    container_name: behance_postgres
    restart: always
    environment:
      POSTGRES_USER: vladharin
      POSTGRES_PASSWORD: "2001"
      POSTGRES_DB: behance_tags_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Кэш и очереди Redis (Защищенный паролем и локальным интерфейсом)
  redis:
    image: redis:7-alpine
    container_name: behance_redis
    restart: always
    # Устанавливаем пароль при запуске
    command: ["redis-server", "--requirepass", "vladMatrixScraper777SafePassword"]
    ports:
      - "127.0.0.1:6379:6379"

  # Наш NestJS бэкенд (Защищенные роуты /admin/queues и /admin/studio)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: behance_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://vladharin:2001@postgres:5432/behance_tags_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=vladMatrixScraper777SafePassword
    depends_on:
      - postgres
      - redis

  # Prisma Studio (Защищена прокси-авторизацией через /admin/studio)
  prisma-studio:
    image: behance-tags-saas-back-api 
    container_name: behance_prisma_studio
    restart: always
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://vladharin:2001@postgres:5432/behance_tags_db?schema=public
    ports:
      - "127.0.0.1:5555:5555"
    command: npx prisma studio --browser none --hostname 0.0.0.0
    depends_on:
      - postgres

volumes:
  postgres_data: