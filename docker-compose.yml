version: '3.8'

services:
  # База данных PostgreSQL (Защищена: доступ только локально/внутри сети)
  postgres:
    image: postgres:15-alpine
    container_name: behance_postgres
    restart: always
    environment:
      POSTGRES_USER: vladharin
      POSTGRES_PASSWORD: "2001"
      POSTGRES_DB: behance_tags_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Кэш и очереди Redis (Защищенный паролем и локальным интерфейсом)
  redis:
    image: redis:7-alpine
    container_name: behance_redis
    restart: always
    command: ["redis-server", "--requirepass", "vladMatrixScraper777SafePassword"]
    ports:
      - "127.0.0.1:6379:6379"

  # Наш NestJS бэкенд (Защищенная очередь /admin/queues)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: behance_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://vladharin:2001@postgres:5432/behance_tags_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=vladMatrixScraper777SafePassword
    depends_on:
      - postgres
      - redis

  # Внутренний сервис Prisma Studio (Работает во внутренней сети на порту 5554)
  prisma-studio:
    image: behance-tags-saas-back-api 
    container_name: behance_prisma_studio
    restart: always
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://vladharin:2001@postgres:5432/behance_tags_db?schema=public
    command: npx prisma studio --browser none --hostname 0.0.0.0 --port 5554
    depends_on:
      - postgres

  # Защищенный прокси Prisma Studio (Порт 5555 с HTTP Basic Auth)
  prisma-studio-proxy:
    image: behance-tags-saas-back-api
    container_name: behance_prisma_studio_proxy
    restart: always
    working_dir: /app
    ports:
      - "5555:5555"
    environment:
      - PRISMA_STUDIO_HOST=prisma-studio
      - PRISMA_STUDIO_TARGET_PORT=5554
      - BULL_BOARD_USER=${BULL_BOARD_USER:-admin}
      - BULL_BOARD_PASSWORD=${BULL_BOARD_PASSWORD:-vladMatrixQueues2026SafeAdmin}
    command: node dist/src/studio-proxy.js
    depends_on:
      - prisma-studio

volumes:
  postgres_data: